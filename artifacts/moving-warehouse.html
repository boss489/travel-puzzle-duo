<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>줄 전체가 움직이는 창고</title><style>:root{font-family:system-ui;background:#102a38;color:#effaff}body{max-width:760px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:560px;margin:18px auto;background:#1d5064;padding:8px;border-radius:14px}.cell{aspect-ratio:1;background:#d5edf0;color:#123544;display:grid;place-items:center;border-radius:7px;font-size:clamp(20px,7vw,42px);cursor:pointer}.exit{background:#ffd166}.player{background:#55d6be}.box{background:#f78c6b}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.controls button{border:0;border-radius:10px;padding:10px 14px;background:#ffd166;color:#123544;font-weight:700;cursor:pointer}.status{text-align:center;min-height:2em;font-weight:700}.tip{text-align:center;color:#b9dce7}@media(max-width:480px){body{padding:10px}}</style><body><header><div><h1>줄 전체가 움직이는 창고</h1><p>한 칸 움직이면 같은 행/열의 상자도 함께 이동합니다.</p></div><strong>스테이지 <span id="stage">1</span>/3</strong></header><div id="board" class="board" aria-label="창고 격자"></div><p id="status" class="status" role="status">상자를 출구(⭐)로 보내세요.</p><div class="controls"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button><button id="undo">되돌리기</button><button id="reset">다시 시작</button></div><p class="tip">키보드 방향키·WASD 또는 버튼으로 이동</p><script>
const levels=[{p:[2,0],b:[7,18],e:24},{p:[12,0],b:[6,19],e:4},{p:[22,0],b:[11,17],e:2}];let s=0,p,b,history=[];const $=x=>document.querySelector(x);function load(){let l=levels[s];p=l.p.slice();b=l.b.slice();history=[];stage.textContent=s+1;status.textContent='상자를 출구(⭐)로 보내세요.';render()}function render(){let l=levels[s],a=Array(25).fill('');a[l.e]='⭐';a[p[0]]='🧑';b.forEach(x=>a[x]='📦');board.innerHTML=a.map((x,i)=>`<button class="cell ${i===l.e?'exit':''} ${i===p[0]?'player':''} ${b.includes(i)?'box':''}" data-i="${i}" aria-label="칸 ${i+1}">${x}</button>`).join('')}function xy(i){return [i%5,Math.floor(i/5)]}function at(x,y){return y*5+x}function move(dx,dy){let [x,y]=xy(p[0]),nx=Math.max(0,Math.min(4,x+dx)),ny=Math.max(0,Math.min(4,y+dy));if(nx===x&&ny===y)return;history.push([p.slice(),b.slice()]);let from=p[0],to=at(nx,ny);p[0]=to;b=b.map(q=>{let [qx,qy]=xy(q);if(q===from&&dy!==0)return at(qx,Math.max(0,Math.min(4,qy+dy)));if(q===from&&dx!==0)return at(Math.max(0,Math.min(4,qx+dx)),qy);return q});render();if(b.includes(levels[s].e)){status.textContent='성공! 다음 창고로 이동합니다.';setTimeout(()=>{s=(s+1)%3;load()},500)}}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m){e.preventDefault();move(...m)}});document.addEventListener('click',e=>{let btn=e.target.closest('[data-move]');if(btn){let m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[btn.dataset.move];move(...m)}let c=e.target.closest('.cell');if(c)status.textContent='직접 이동으로 상자를 밀어 보세요.'});undo.onclick=()=>{let h=history.pop();if(h){[p,b]=h;render();status.textContent='한 단계 되돌렸어요.'}};reset.onclick=load;load();</script>
