<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3분 여행 가방</title><style>:root{font-family:system-ui;background:#fff8ed;color:#243047}body{margin:auto;max-width:900px;padding:18px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(220px,.8fr);gap:18px}.bag{display:grid;grid-template-columns:repeat(6,1fr);aspect-ratio:6/5;background:#c78954;padding:8px;border-radius:18px;gap:5px;box-shadow:inset 0 0 0 5px #8b5739}.cell{background:#f8dfb9;border-radius:6px;min-width:0;display:grid;place-items:center;font-size:clamp(18px,5vw,34px);cursor:pointer}.cell.selected{outline:4px solid #ef6c4d}.items{display:flex;gap:8px;flex-wrap:wrap}.item{border:0;background:#fff;border-radius:12px;padding:10px;font-size:25px;cursor:pointer;box-shadow:0 2px 8px #0002}.item[aria-pressed=true]{background:#ffe07b}.item.used{opacity:.4}.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001}button{font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{border:0;border-radius:10px;padding:9px 12px;background:#294c77;color:white;cursor:pointer}.status{min-height:2.4em;font-weight:700}@media(max-width:650px){.layout{grid-template-columns:1fr}.bag{max-width:520px;margin:auto}}</style><body><header><div><h1>3분 여행 가방</h1><p>물건을 골라 가방 칸을 채우세요. 깨지기 쉬운 물건은 아래 칸에 둘 수 없어요.</p></div><strong id="timer">03:00</strong></header><main class="layout"><section><div id="bag" class="bag" aria-label="가방 격자"></div><div class="actions"><button id="rotate">선택 물건 회전</button><button id="undo">되돌리기</button><button id="reset">다시 시작</button></div></section><aside class="panel"><h2>여행 물건</h2><div id="items" class="items"></div><p id="status" class="status" role="status"></p><p>목표: <span id="goal"></span></p></aside></main><script>
const base=[['🧢','모자',1,false],['📷','카메라',2,true],['🧴','물병',2,false],['🧸','인형',2,true],['🔦','랜턴',1,false],['🧦','양말',1,false]];let selected=null,history=[],placed=Array(30).fill(null),rot=0,level=0;const goals=[['카메라','인형'],['모자','물병','랜턴'],['카메라','물병','양말']];
const $=s=>document.querySelector(s);function snapshot(){history.push(JSON.stringify(placed));if(history.length>20)history.shift()}function render(){bag.innerHTML=placed.map((x,i)=>`<button class="cell ${x?'selected':''}" data-i="${i}" aria-label="가방 ${i+1}번 칸">${x?x.icon:''}</button>`).join('');items.innerHTML=base.map((x,i)=>`<button class="item ${placed.some(p=>p?.id===i)?'used':''}" data-id="${i}" aria-pressed="${selected===i}">${x[0]}<small>${x[1]}</small></button>`).join('');goal.textContent=goals[level].join(' + ');status.textContent=placed.filter(Boolean).length?`${placed.filter(Boolean).length}개 배치 · 빈 칸을 눌러 물건을 놓으세요.`:'물건을 고르고 빈 칸을 눌러 배치하세요.'}function win(){let names=placed.filter(Boolean).map(x=>x.name);return goals[level].every(n=>names.includes(n))}document.addEventListener('click',e=>{let it=e.target.closest('.item'),cell=e.target.closest('.cell');if(it){selected=+it.dataset.id;render()}else if(cell&&selected!==null){let i=+cell.dataset.i,x=base[selected];if(x[3]&&i>=24){status.textContent='깨지기 쉬운 물건은 아래 두 줄에 놓을 수 없어요.';return}if(placed[i]){status.textContent='그 칸은 이미 차 있어요.';return}snapshot();placed[i]={id:selected,icon:x[0],name:x[1],fragile:x[3],rot};selected=null;render();if(win()){status.textContent='성공! 다음 가방으로 이동합니다.';setTimeout(()=>{level=(level+1)%goals.length;placed.fill(null);history=[];render()},500)}}});rotate.onclick=()=>{rot=(rot+90)%360;status.textContent=`선택 물건 방향 ${rot}°`;};undo.onclick=()=>{if(history.length){placed=JSON.parse(history.pop());render();status.textContent='한 단계 되돌렸어요.'}};reset.onclick=()=>{placed.fill(null);history=[];selected=null;level=0;render();status.textContent='새 여행을 시작했어요.'};let t=180;setInterval(()=>{if(t>0)t--;timer.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`},1000);render();</script>
